<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMEN RGB</title>
<link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/quartz/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head><body><main class="container py-4" style="max-width:960px">
<header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><h1 class="h3 m-0"><i class="fa-solid fa-lightbulb me-2"></i>OMEN RGB</h1><span id="connection" class="badge bg-warning">Connexion…</span></header>
<section class="card mb-4"><div class="card-body d-flex justify-content-between align-items-center gap-3"><div><h2 class="h5 mb-1">Éclairage général</h2><small id="hardware">État du contrôleur inconnu</small></div><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="enabled" style="width:3.5em;height:1.8em" aria-label="Éclairage activé"></div></div></section>
<div class="row g-3" id="zones"></div>
<section class="card mt-4"><div class="card-body"><label for="allColor" class="form-label">Couleur globale</label><div class="input-group"><input type="color" class="form-control form-control-color" id="allColor" value="#ffffff"><button class="btn btn-success" id="applyAll" type="button">Appliquer aux 3 zones</button></div></div></section>
<p class="small mt-3" id="message" aria-live="polite"></p>
</main>
<script src="/app.js"></script></body></html>
